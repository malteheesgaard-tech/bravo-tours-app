  40%          { transform: translateY(-9px); }
}
@keyframes pulse {
  0%,100% { opacity: 1; }
  50%      { opacity: .4; }
}

}
@keyframes shimmer {
  0%   { background-position: -400px 0; }
  100% { background-position: 400px 0; }

function ProgressBar({ current, total }) {
  const pct = ((current) / total) * 100;
  return (
    <div style={{ height: 3, background: 'rgba(255,255,255,0.15)' }}>
      <div style={{
        height: '100%',
        width: `${pct}%`,
        background: C.gold,
        transition: 'width 0.4s ease',
        borderRadius: '0 2px 2px 0',
      }}/>
    </div>
  );
}

      padding: '10px 16px',
      borderRadius: 12,
      border: `2px solid ${selected ? C.blue : C.border}`,
      background: selected ? 'rgba(45,95,166,0.08)' : C.white,
      boxShadow: selected ? `0 0 0 3px rgba(45,95,166,0.15), inset 0 0 0 1px ${C.blue}` : '0 1px 3px rgba(0,0,0,0.06)',
      cursor: 'pointer',
      transition: 'all 0.15s ease',
      width: '100%',
      textAlign: 'left',
    }}>
      <span style={{ fontSize: 22, lineHeight: 1 }}>{emoji}</span>
      <span style={{
        fontSize: 15,
        fontWeight: selected ? 600 : 400,
        color: selected ? C.blue : C.navy,
        fontFamily: 'DM Sans, sans-serif',
      }}>{label}</span>
      {selected && (
        <span style={{
          marginLeft: 'auto',
          width: 20, height: 20,
          borderRadius: '50%',
          background: C.blue,
          display: 'flex', alignItems: 'center', justifyContent: 'center',
          fontSize: 11, color: 'white', fontWeight: 700, flexShrink: 0,
        }}>✓</span>
      )}
    </button>
  );
}

/* ─── Quiz Screen ─── */
function QuizScreen({ step, answers, onToggle, onNext, onBack }) {
  const q = QUESTIONS[step];
  const sel = answers[q.id] || [];
  const canNext = sel.length > 0;

  return (
    <div style={{ animation: 'fadeUp 0.3s ease', padding: '20px 20px 24px' }}>
      <div style={{ marginBottom: 6 }}>
        <span style={{ fontSize: 11, color: C.gray, textTransform: 'uppercase', letterSpacing: 0.8, fontWeight: 600 }}>
          Spørgsmål {step + 1} af {QUESTIONS.length}
        </span>
      </div>
      <h2 style={{
        fontFamily: 'Playfair Display, serif',
        fontSize: 22,
        fontWeight: 700,
        color: C.navy,
        marginBottom: 6,
        lineHeight: 1.25,
      }}>{q.q}</h2>
      <p style={{ fontSize: 12, color: C.gray, marginBottom: 18 }}>Vælg én eller flere</p>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 20 }}>
        {q.opts.map(o => (
          <Chip
            key={o.label}
            emoji={o.emoji}
            label={o.label}
            selected={sel.includes(o.label)}
            onClick={() => onToggle(q.id, o.label)}
          />
        ))}
      </div>

      <div style={{ display: 'flex', gap: 8 }}>
        {step > 0 && (
          <button onClick={onBack} style={{
            padding: '12px 16px',
            borderRadius: 10,
            border: `1.5px solid ${C.border}`,
            background: 'transparent',
            color: C.gray,
            fontSize: 14,
            cursor: 'pointer',
            fontFamily: 'DM Sans, sans-serif',
          }}>← Tilbage</button>
        )}
        <button onClick={onNext} disabled={!canNext} style={{
          flex: 1,
          padding: '13px 0',
          borderRadius: 10,
          border: 'none',
          background: canNext ? C.blue : C.border,
          color: canNext ? C.white : C.gray,
          fontSize: 15,
          fontWeight: 600,
          cursor: canNext ? 'pointer' : 'default',
          fontFamily: 'DM Sans, sans-serif',
          transition: 'all 0.15s ease',
          boxShadow: canNext ? '0 4px 12px rgba(45,95,166,0.3)' : 'none',
        }}>
          {step < QUESTIONS.length - 1 ? 'Næste →' : 'Find mine rejser ✨'}
        </button>
      </div>
    </div>
  );
}

/* ─── Loading Screen ─── */
function LoadingScreen({ answers }) {
  const tags = Object.values(answers).flat().slice(0, 6);
  const [dotIdx, setDotIdx] = useState(0);
  const msgs = [
    'Analyserer dine rejsepræferencer...',
    'Matcher med 24 destinationer...',
    'Finder de bedste tilbud...',
    'Sammensætter dine personlige forslag...',
  ];

  useEffect(() => {
    const t = setInterval(() => setDotIdx(i => (i + 1) % msgs.length), 1800);
    return () => clearInterval(t);
  }, []);

  return (
    <div style={{ padding: '36px 24px', textAlign: 'center', animation: 'fadeUp 0.4s ease' }}>
      <div style={{ fontSize: 52, marginBottom: 8, animation: 'planefly 2s ease-in-out infinite' }}>✈️</div>
      <h2 style={{
        fontFamily: 'Playfair Display, serif',
        fontSize: 20,
        color: C.navy,
        marginBottom: 6,
      }}>Finder dine drømmerejser</h2>
      <p style={{
        fontSize: 13,
        color: C.gray,
        marginBottom: 28,
        minHeight: 20,
        animation: 'pulse 0.5s ease',
        key: dotIdx,
      }}>{msgs[dotIdx]}</p>

      <div style={{ marginBottom: 28 }}>
        <span className="dot" style={{display:'inline-block',width:9,height:9,borderRadius:'50%',background:C.blue,animation:'bounce 1.4s ease infinite',margin:'0 4px'}}/>
        <span className="dot" style={{display:'inline-block',width:9,height:9,borderRadius:'50%',background:C.blue,animation:'bounce 1.4s ease .2s infinite',margin:'0 4px'}}/>
        <span className="dot" style={{display:'inline-block',width:9,height:9,borderRadius:'50%',background:C.blue,animation:'bounce 1.4s ease .4s infinite',margin:'0 4px'}}/>
      </div>

      <div style={{
        background: C.bg,
        borderRadius: 12,
        padding: '14px 16px',
        textAlign: 'left',
      }}>
        <div style={{ fontSize: 11, color: C.light, fontWeight: 600, marginBottom: 8, textTransform: 'uppercase', letterSpacing: 0.6 }}>
          Dine præferencer
        </div>
        <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5 }}>
          {tags.map((t, i) => (
            <span key={i} style={{
              background: 'rgba(45,95,166,0.1)',
              color: C.blue,
              borderRadius: 20,
              padding: '3px 10px',
              fontSize: 12,
              fontWeight: 500,
            }}>{t}</span>
          ))}
        </div>
      </div>
    </div>
  );
}

/* ─── Result Card ─── */
function ResultCard({ trip, best, idx }) {
  const [expanded, setExpanded] = useState(idx === 0);
  return (
    <div style={{
      border: `2px solid ${best ? C.gold : C.border}`,
      borderRadius: 16,
      overflow: 'hidden',
      background: C.white,
      marginBottom: 12,
      animation: `fadeUp ${0.3 + idx * 0.1}s ease`,
      boxShadow: best ? `0 4px 20px rgba(212,168,67,0.2)` : '0 2px 8px rgba(0,0,0,0.06)',
    }}>
      {/* Destination photo banner */}
      {(() => {
        const { url, gradient } = destPhoto(trip.name);
        return (
          <div style={{ height: best ? 150 : 100, position: 'relative', overflow: 'hidden', background: gradient }}>
            <img src={url} alt={trip.name}
              style={{ position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover', display:'block' }}
              onError={e => { e.target.style.display='none'; }}
            />
            <div style={{ position:'absolute', inset:0, background:'linear-gradient(to bottom, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.5) 100%)' }}/>
            {best && (
              <div style={{ position:'absolute', top:10, left:10, zIndex:2, background:C.gold, color:'white', fontSize:10, fontWeight:700, padding:'4px 10px', borderRadius:20, letterSpacing:0.5 }}>
                ⭐ BEDSTE MATCH
              </div>
            )}
            <div style={{ position:'absolute', bottom:10, left:14, zIndex:2 }}>
              <div style={{ fontFamily:'Playfair Display, serif', fontSize: best ? 20 : 15, fontWeight:700, color:'white', textShadow:'0 1px 6px rgba(0,0,0,0.5)' }}>
                {trip.name}
              </div>
              <div style={{ fontSize:11, color:'rgba(255,255,255,0.8)', marginTop:1 }}>{trip.country}</div>
            </div>
            <div style={{ position:'absolute', bottom:10, right:12, zIndex:2, fontSize: best ? 30 : 22, filter:'drop-shadow(0 2px 4px rgba(0,0,0,0.4))' }}>{trip.emoji}</div>
          </div>
        );
      })()}

      <div style={{ padding: '12px 14px' }}>
        <div style={{ display: 'flex', alignItems: 'flex-start', justifyContent: 'space-between', marginBottom: 4 }}>
          <div>
            <h3 style={{
              fontFamily: 'Playfair Display, serif',
              fontSize: best ? 17 : 14,
              fontWeight: 700,
              color: C.navy,
              marginBottom: 2,
              display: 'none',
            }}>{trip.name}</h3>
            <div style={{ fontSize: 11, color: C.gray }}>{trip.country} · {trip.travelForm}</div>
          </div>
          <div style={{ textAlign: 'right', flexShrink: 0, marginLeft: 10 }}>
            <div style={{ fontSize: 15, fontWeight: 700, color: C.blue }}>fra {trip.priceFrom}</div>
            <div style={{ fontSize: 10, color: C.gray }}>✈️ {trip.flightTime}</div>
          </div>
        </div>

        {best && (
          <p style={{ fontSize: 12, color: '#555', lineHeight: 1.6, marginBottom: 10, fontStyle: 'italic', color: C.gray }}>
            "{trip.tagline}"
          </p>
        )}

        {expanded && (
          <div style={{ animation: 'fadeUp 0.2s ease' }}>
            <p style={{ fontSize: 12, color: '#444', lineHeight: 1.65, marginBottom: 10 }}>
              {trip.description}
            </p>
            <div style={{ display: 'flex', flexWrap: 'wrap', gap: 5, marginBottom: 12 }}>
              {(trip.highlights || []).map((h, i) => (
                <span key={i} style={{
                  border: `1.5px solid ${C.border}`,
                  color: C.navy,
                  borderRadius: 20,
                  padding: '3px 10px',
                  fontSize: 11,
                }}>✓ {h}</span>
              ))}
            </div>
          </div>
        )}

        {!best && !expanded && (
          <button onClick={() => setExpanded(true)} style={{
            background: 'none', border: 'none', color: C.light, fontSize: 12,
            cursor: 'pointer', padding: '2px 0', fontFamily: 'DM Sans, sans-serif',
            marginBottom: 6, display: 'block',
          }}>
            Vis detaljer ↓
          </button>
        )}

        <a href={trip.url} target="_blank" rel="noopener" style={{
          display: 'block',
          background: best ? C.blue : C.bg,
          color: best ? C.white : C.blue,
          borderRadius: 10,
          padding: '10px 0',
          textAlign: 'center',
          fontSize: 13,
          fontWeight: 600,
          textDecoration: 'none',
          border: best ? 'none' : `1.5px solid ${C.border}`,
          transition: 'opacity 0.15s',
        }}>
          Se rejsen på Bravo Tours →
        </a>
      </div>
    </div>
  );
}

/* ─── Results Screen ─── */
function ResultsScreen({ results, onReset }) {
  return (
    <div style={{ padding: '16px 16px 24px', animation: 'fadeUp 0.4s ease' }}>
      <div style={{ marginBottom: 16, textAlign: 'center' }}>
        <div style={{ fontSize: 32, marginBottom: 6 }}>✨</div>
        <h2 style={{
          fontFamily: 'Playfair Display, serif',
          fontSize: 21,
          fontWeight: 700,
          color: C.navy,
          marginBottom: 4,
        }}>Dine personlige rejseforslag</h2>
        <p style={{ fontSize: 12, color: C.gray }}>Udvalgt af AI baseret på dine svar</p>
      </div>

      {results.map((trip, i) => (
        <ResultCard key={i} trip={trip} best={i === 0} idx={i} />
      ))}

      <button onClick={onReset} style={{
        width: '100%',
        padding: '12px 0',
        borderRadius: 10,
        border: `2px dashed ${C.border}`,
        background: 'transparent',
        color: C.gray,
        fontSize: 14,
        cursor: 'pointer',
        fontFamily: 'DM Sans, sans-serif',
        marginTop: 4,
      }}>
        ↺ Tag testen igen
      </button>
    </div>
  );
}

/* ─── Error Screen ─── */
function ErrorScreen({ message, onRetry }) {
  return (
    <div style={{ padding: '40px 24px', textAlign: 'center' }}>
      <div style={{ fontSize: 40, marginBottom: 12 }}>😕</div>
      <h3 style={{ fontFamily: 'Playfair Display, serif', fontSize: 18, color: C.navy, marginBottom: 8 }}>
        Noget gik galt
      </h3>
      <p style={{ fontSize: 13, color: C.gray, marginBottom: 20, lineHeight: 1.6 }}>{message}</p>
      <button onClick={onRetry} style={{
        padding: '12px 28px', borderRadius: 10, border: 'none',
        background: C.blue, color: 'white', fontSize: 14, fontWeight: 600,
        cursor: 'pointer', fontFamily: 'DM Sans, sans-serif',
      }}>Prøv igen</button>
    </div>
  );
}

/* ─── Main App ─── */
function BravoApp() {
  const STORAGE_KEY = 'bravo_quiz_state';
  const saved = (() => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch { return null; } })();

  const [step, setStep] = useState(saved?.step ?? 0);
  const [answers, setAnswers] = useState(saved?.answers ?? {});
  const [phase, setPhase] = useState(() => {
    if (!saved) return 'welcome';
    // Don't restore 'welcome' or 'loading' from storage; map quiz@step0/no-answers back to welcome
    if (saved.phase === 'welcome') return 'welcome';
    if (saved.phase === 'loading') return 'quiz';
    if (saved.phase === 'quiz' && saved.step === 0 && Object.keys(saved.answers || {}).length === 0) return 'welcome';
    return saved.phase ?? 'welcome';
  }); // quiz | loading | results | error
  const [results, setResults] = useState(saved?.results ?? []);
  const [errorMsg, setErrorMsg] = useState('');

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ step, answers, phase, results }));
  }, [step, answers, phase, results]);

  const toggle = (id, val) => {
    setAnswers(prev => {
      const cur = prev[id] || [];
      return { ...prev, [id]: cur.includes(val) ? cur.filter(x => x !== val) : [...cur, val] };
    });
  };

  const next = async () => {
    if (step < QUESTIONS.length - 1) {
      setStep(s => s + 1);
    } else {
      setPhase('loading');
      try {
        const userMsg = QUESTIONS.map(q => `${q.q}: ${(answers[q.id] || []).join(', ')}`).join('\n');
        const raw = await window.claude.complete({
          messages: [{ role: 'user', content: `Brugerens svar:\n${userMsg}\n\nGiv mig 3 personlige rejseforslag som JSON-array.` }],
          system: SYSTEM_PROMPT,
        });
        const match = raw.match(/\[[\s\S]*\]/);
        if (!match) throw new Error('Ugyldigt svar fra AI');
        const trips = JSON.parse(match[0]);
        setResults(trips);
        setPhase('results');
      } catch (e) {
        setErrorMsg(e.message || 'Kunne ikke generere forslag. Prøv igen.');
        setPhase('error');
      }
    }
  };

  const reset = () => {
    setStep(0); setAnswers({}); setPhase('welcome'); setResults([]);
    localStorage.removeItem(STORAGE_KEY);
  };

  const innerContent = (
    <div style={{
      width: '100%',
      height: '100%',
      overflowY: 'auto',
      background: C.bg,
    }}>
      {/* Header — hidden on welcome */}
      {phase !== 'welcome' && <div style={{ background: C.navy, position: 'sticky', top: 0, zIndex: 10 }}>
        <div style={{
          padding: '12px 20px 10px',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <div>
            <div style={{
              fontFamily: 'Playfair Display, serif',
              color: C.gold, fontSize: 18, fontWeight: 700, letterSpacing: 0.3,
            }}>BRAVO TOURS</div>
            <div style={{ fontSize: 10, color: 'rgba(255,255,255,0.5)', letterSpacing: 0.3 }}>Med jer hele vejen</div>
          </div>
          {phase === 'quiz' && (
            <div style={{
              background: 'rgba(255,255,255,0.1)',
              borderRadius: 20, padding: '4px 12px',
              fontSize: 12, color: 'rgba(255,255,255,0.7)',
              fontWeight: 600,
            }}>
              {step + 1} / {QUESTIONS.length}
            </div>
          )}
          {phase === 'results' && (
            <button onClick={reset} style={{
              background: 'transparent', border: '1px solid rgba(255,255,255,0.3)',
              borderRadius: 20, padding: '4px 12px',
              fontSize: 11, color: 'rgba(255,255,255,0.6)',
              cursor: 'pointer', fontFamily: 'DM Sans, sans-serif',
            }}>↺ Start forfra</button>
          )}
        </div>
        {phase === 'quiz' && <ProgressBar current={step + 1} total={QUESTIONS.length} />}
        {phase === 'loading' && (
          <div style={{ height: 3, background: 'rgba(255,255,255,0.15)', overflow: 'hidden' }}>
            <div style={{
              height: '100%', width: '40%',
              background: C.gold,
              animation: 'shimmer 1.5s ease infinite',
              backgroundImage: `linear-gradient(90deg, ${C.gold} 0%, #f0c96a 50%, ${C.gold} 100%)`,
              backgroundSize: '400px 100%',
            }}/>
          </div>
        )}
      </div>}

      {/* Content */}
      <div style={{ maxWidth: 440, margin: '0 auto' }}>
        {phase === 'welcome' && <WelcomeScreen onStart={() => setPhase('quiz')} />}
        {phase === 'quiz'    && <QuizScreen step={step} answers={answers} onToggle={toggle} onNext={next} onBack={() => setStep(s => s - 1)} />}
        {phase === 'loading' && <LoadingScreen answers={answers} />}
        {phase === 'results' && <ResultsScreen results={results} onReset={reset} />}
        {phase === 'error'   && <ErrorScreen message={errorMsg} onRetry={() => setPhase('quiz')} />}
      </div>
    </div>
  );

  return (
    <ChromeWindow
      tabs={[{ title: 'Bravo Tours – Find din rejse' }]}
      url="www.bravotours.dk/rejsegenerator"
      width={520}
      height={720}
    >
      {innerContent}
    </ChromeWindow>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BravoApp/>);
</script>
<div id="root"></div>
</body>
</html>
