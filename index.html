function useIsMobile(bp = 640) {
  const [m, setM] = useState(typeof window !== 'undefined' ? window.innerWidth <= bp : false);
  useEffect(() => {
    const on = () => setM(window.innerWidth <= bp);
    window.addEventListener('resize', on);
    return () => window.removeEventListener('resize', on);
  }, [bp]);
  return m;
}

/* ─── Chip option ─── */
function Chip({ emoji, label, selected, onClick }) {
  return (
    <button onClick={onClick} style={{
      display: 'flex',
      alignItems: 'center',
      gap: 8,
      padding: '10px 16px',
      borderRadius: 12,
      border: `2px solid ${selected ? C.blue : C.border}`,

      boxShadow: selected ? `0 0 0 3px rgba(45,95,166,0.15), inset 0 0 0 1px ${C.blue}` : '0 1px 3px rgba(0,0,0,0.06)',
      cursor: 'pointer',
      transition: 'all 0.15s ease',
      width: '100%',
      textAlign: 'left',
    }}>
      <span style={{ fontSize: 22, lineHeight: 1 }}>{emoji}</span>
      <span style={{
        fontSize: 15,
        fontWeight: selected ? 600 : 400,
        color: selected ? C.blue : C.navy,
        fontFamily: 'DM Sans, sans-serif',
      }}>{label}</span>

        <span style={{
          marginLeft: 'auto',
          width: 20, height: 20,
          borderRadius: '50%',
          background: C.blue,

/* ─── Quiz Screen ─── */
function QuizScreen({ step, answers, onToggle, onNext, onBack }) {
  const q = QUESTIONS[step];
  const sel = answers[q.id] || [];
  const canNext = sel.length > 0;

  return (
    <div style={{ animation: 'fadeUp 0.3s ease', padding: '20px 20px 24px' }}>
      <div style={{ marginBottom: 6 }}>
        <span style={{ fontSize: 11, color: C.gray, textTransform: 'uppercase', letterSpacing: 0.8, fontWeight: 600 }}>
          Spørgsmål {step + 1} af {QUESTIONS.length}
        </span>
      </div>
      <h2 style={{
        fontFamily: 'Playfair Display, serif',
        fontSize: 22,
        fontWeight: 700,
        color: C.navy,
        marginBottom: 6,
        lineHeight: 1.25,
      }}>{q.q}</h2>
      <p style={{ fontSize: 12, color: C.gray, marginBottom: 18 }}>Vælg én eller flere</p>

      <div style={{ display: 'flex', flexDirection: 'column', gap: 8, marginBottom: 20 }}>
        {q.opts.map(o => (
          <Chip
            key={o.label}
            emoji={o.emoji}
            label={o.label}
            selected={sel.includes(o.label)}
            onClick={() => onToggle(q.id, o.label)}
          />
        ))}
      </div>

      <div style={{ display: 'flex', gap: 8 }}>
        {step > 0 && (
          <button onClick={onBack} style={{
            padding: '12px 16px',
            borderRadius: 10,
            border: `1.5px solid ${C.border}`,
            background: 'transparent',
            color: C.gray,
            fontSize: 14,
            cursor: 'pointer',
            fontFamily: 'DM Sans, sans-serif',
          }}>← Tilbage</button>
        )}
        <button onClick={onNext} disabled={!canNext} style={{
          flex: 1,
          padding: '13px 0',
          borderRadius: 10,
          border: 'none',
          background: canNext ? C.blue : C.border,
          color: canNext ? C.white : C.gray,
          fontSize: 15,
          fontWeight: 600,
          cursor: canNext ? 'pointer' : 'default',
          fontFamily: 'DM Sans, sans-serif',
          transition: 'all 0.15s ease',
          boxShadow: canNext ? '0 4px 12px rgba(45,95,166,0.3)' : 'none',
        }}>
          {step < QUESTIONS.length - 1 ? 'Næste →' : 'Find mine rejser ✨'}
        </button>
      </div>
    </div>
  );
}

/* ─── Loading Screen ─── */

  const [dotIdx, setDotIdx] = useState(0);

      <div style={{ fontSize: 52, marginBottom: 8, animation: 'planefly 2s ease-in-out infinite' }}>✈️</div>

        const { url, gradient } = destPhoto(trip.name);
        return (
          <div style={{ height: best ? 150 : 100, position: 'relative', overflow: 'hidden', background: gradient }}>
            <img src={url} alt={trip.name}
              style={{ position:'absolute', inset:0, width:'100%', height:'100%', objectFit:'cover', display:'block' }}

            <div style={{ position:'absolute', bottom:10, left:14, zIndex:2 }}>

                {trip.name}
              </div>
              <div style={{ fontSize:11, color:'rgba(255,255,255,0.8)', marginTop:1 }}>{trip.country}</div>
            </div>
            <div style={{ position:'absolute', bottom:10, right:12, zIndex:2, fontSize: best ? 30 : 22, filter:'drop-shadow(0 2px 4px rgba(0,0,0,0.4))' }}>{trip.emoji}</div>

function recommendTrips(answers) {
  const sel = id => answers[id] || [];
  const goalMap = { 'Afslapning og ro':'relax', 'Kultur og seværdigheder':'culture', 'Eventyr og aktiviteter':'adventure', 'Fest og natteliv':'party', 'Natur og stilhed':'nature' };
  const typeMap = { 'Strand og hav':'beach', 'Storby og byliv':'city', 'Bjerge og natur':'mountain', 'Hyggelige landsbyer':'village' };
  const climMap = { 'Meget varmt 30°C+':'hot', 'Mildt og solrigt 22–28°C':'mild', 'Tropisk og eksotisk':'tropical' };
  const formMap = { 'Klassisk solferie':'solferie', 'All Inclusive':'all-inclusive', 'Rundrejse':'roundtrip', 'Safari og natur':'safari', 'Aktiv ferie':'active' };
  const whoMap  = { 'Alene':'alone', 'Som par':'couple', 'Med venner':'friends', 'Med familie':'family' };
  const actMap  = { 'Mest afslapning':1, 'En blanding':2, 'Meget aktiv':3 };
  const budgetMap = { 'Under 4.000 kr.':1, '4.000–8.000 kr.':2, '8.000–15.000 kr.':3, 'Ingen grænse':4 };

  const goals   = sel('goal').map(x => goalMap[x]).filter(Boolean);
  const types   = sel('dest').map(x => typeMap[x]).filter(Boolean);
  const climAny = sel('climate').includes('Vejret er ligegyldigt');
  const clims   = sel('climate').map(x => climMap[x]).filter(Boolean);
  const forms   = sel('type').map(x => formMap[x]).filter(Boolean);
  const whos    = sel('who').map(x => whoMap[x]).filter(Boolean);
  const acts    = sel('activity').map(x => actMap[x]).filter(Boolean);
  const budgetLevels = sel('budget').map(x => budgetMap[x]).filter(Boolean);
  const flightPrefs = sel('flight'); // labels

  const bucketOf = h => h <= 3.5 ? 'short' : (h <= 6.5 ? 'medium' : 'long');

  const scored = REC.map((d, i) => {
    let s = 0;
    // Mål
    goals.forEach(g => { if (d.goals.includes(g)) s += 3; });
    // Destinationstype
    types.forEach(t => { if (d.types.includes(t)) s += 3; });
    // Klima
    if (climAny) s += 1;
    clims.forEach(c => { if (d.climate.includes(c)) s += 3; });
    // Aktivitetsniveau (tættest match)
    if (acts.length) {
      const best = Math.min(...acts.map(a => Math.abs(a - d.activity)));
      s += (2 - best);
    }
    // Rejseform (stærkt signal)
    forms.forEach(f => { if (d.forms.includes(f)) s += 4; });
    // Rejser med
    whos.forEach(w => { if (d.who.includes(w)) s += 1; });
    // Flyvetid
    if (flightPrefs.length) {
      const b = bucketOf(d.flightHours);
      let best = -99;
      flightPrefs.forEach(p => {
        let v = 0;
        if (p === '0–3 timer')      v = b === 'short' ? 3 : (b === 'medium' ? 0 : -8);
        else if (p === '3–6 timer') v = b === 'short' ? 2 : (b === 'medium' ? 3 : -6);
        else if (p === 'Lang distance') v = b === 'long' ? 5 : (b === 'medium' ? -2 : -3);
        if (v > best) best = v;
      });
      s += best;
    }
    // Budget
    if (budgetLevels.length) {
      const maxB = Math.max(...budgetLevels);
      if (d.priceLevel <= maxB) s += 2;
      else s -= 4 * (d.priceLevel - maxB);
    }
    return { d, s, i };
  });

  scored.sort((a, b) => b.s - a.s || a.i - b.i);
  const top = scored.slice(0, 3).map(x => x.d);

  // Personlig beskrivelse ud fra svarene
  const whoTxt = { 'Alene':'på din solotur', 'Som par':'til jer to', 'Med venner':'til vennegruppen', 'Med familie':'til hele familien' };
  const goalTxt = { 'Afslapning og ro':'ro og afslapning', 'Kultur og seværdigheder':'kultur og seværdigheder', 'Eventyr og aktiviteter':'eventyr og oplevelser', 'Fest og natteliv':'fest og godt humør', 'Natur og stilhed':'natur og stilhed' };
  const who1 = sel('who')[0];
  const goal1 = sel('goal')[0];
  const prefix = [];
  if (who1 && whoTxt[who1]) prefix.push(`Perfekt ${whoTxt[who1]}`);
  if (goal1 && goalTxt[goal1]) prefix.push(prefix.length ? `med fokus på ${goalTxt[goal1]}` : `Perfekt til ${goalTxt[goal1]}`);
  const personal = prefix.length ? prefix.join(' ') + '. ' : '';

  return top.map(d => ({
    name: d.name,
    country: d.country,
    emoji: d.emoji,
    tagline: d.tagline,
    description: personal + d.description,
    highlights: d.highlights,
    travelForm: ({solferie:'Solferie','all-inclusive':'All Inclusive',roundtrip:'Rundrejse',safari:'Safari',active:'Aktiv ferie'})[d.forms[0]] || 'Solferie',
    flightTime: d.flightTime,
    priceFrom: d.priceFrom,
    url: d.url,
  }));
}

/* ─── Main App ─── */
function BravoApp() {
  const STORAGE_KEY = 'bravo_quiz_state';
  const saved = (() => { try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); } catch { return null; } })();

  const [step, setStep] = useState(saved?.step ?? 0);
  const [answers, setAnswers] = useState(saved?.answers ?? {});
  const [phase, setPhase] = useState(() => {
    if (!saved) return 'welcome';
    // Don't restore 'welcome' or 'loading' from storage; map quiz@step0/no-answers back to welcome
    if (saved.phase === 'welcome') return 'welcome';
    if (saved.phase === 'loading') return 'quiz';
    if (saved.phase === 'quiz' && saved.step === 0 && Object.keys(saved.answers || {}).length === 0) return 'welcome';
    return saved.phase ?? 'welcome';
  }); // quiz | loading | results | error
  const [results, setResults] = useState(saved?.results ?? []);
  const [errorMsg, setErrorMsg] = useState('');
  const isMobile = useIsMobile();

  useEffect(() => {
    localStorage.setItem(STORAGE_KEY, JSON.stringify({ step, answers, phase, results }));
  }, [step, answers, phase, results]);

  const toggle = (id, val) => {
    setAnswers(prev => {
      const cur = prev[id] || [];
      return { ...prev, [id]: cur.includes(val) ? cur.filter(x => x !== val) : [...cur, val] };
    });
  };

  const next = async () => {
    if (step < QUESTIONS.length - 1) {
      setStep(s => s + 1);
    } else {
      setPhase('loading');
      try {
        const trips = recommendTrips(answers);
        // kort forsinkelse så loading-animationen når at ses
        await new Promise(r => setTimeout(r, 1400));
        setResults(trips);
        setPhase('results');
      } catch (e) {
        setErrorMsg(e.message || 'Kunne ikke generere forslag. Prøv igen.');
        setPhase('error');
      }
    }
  };

  const reset = () => {
    setStep(0); setAnswers({}); setPhase('welcome'); setResults([]);
    localStorage.removeItem(STORAGE_KEY);
  };

  const innerContent = (
    <div style={{
      width: '100%',
      height: '100%',
      overflowY: 'auto',
      background: C.bg,
    }}>
      {/* Header — hidden on welcome */}
      {phase !== 'welcome' && <div style={{ background: C.navy, position: 'sticky', top: 0, zIndex: 10 }}>
        <div style={{
          padding: '12px 20px 10px',
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
        }}>
          <div>
            <div style={{
              fontFamily: 'Playfair Display, serif',
              color: C.gold, fontSize: 18, fontWeight: 700, letterSpacing: 0.3,
            }}>BRAVO TOURS</div>
            <div style={{ fontSize: 10, color: 'rgba(255,255,255,0.5)', letterSpacing: 0.3 }}>Med jer hele vejen</div>
          </div>
          {phase === 'quiz' && (
            <div style={{
              background: 'rgba(255,255,255,0.1)',
              borderRadius: 20, padding: '4px 12px',
              fontSize: 12, color: 'rgba(255,255,255,0.7)',
              fontWeight: 600,
            }}>
              {step + 1} / {QUESTIONS.length}
            </div>
          )}
          {phase === 'results' && (
            <button onClick={reset} style={{
              background: 'transparent', border: '1px solid rgba(255,255,255,0.3)',
              borderRadius: 20, padding: '4px 12px',
              fontSize: 11, color: 'rgba(255,255,255,0.6)',
              cursor: 'pointer', fontFamily: 'DM Sans, sans-serif',
            }}>↺ Start forfra</button>
          )}
        </div>
        {phase === 'quiz' && <ProgressBar current={step + 1} total={QUESTIONS.length} />}
        {phase === 'loading' && (
          <div style={{ height: 3, background: 'rgba(255,255,255,0.15)', overflow: 'hidden' }}>
            <div style={{
              height: '100%', width: '40%',
              background: C.gold,
              animation: 'shimmer 1.5s ease infinite',
              backgroundImage: `linear-gradient(90deg, ${C.gold} 0%, #f0c96a 50%, ${C.gold} 100%)`,
              backgroundSize: '400px 100%',
            }}/>
          </div>
        )}
      </div>}

      {/* Content */}
      <div style={{ maxWidth: 440, margin: '0 auto' }}>
        {phase === 'welcome' && <WelcomeScreen onStart={() => setPhase('quiz')} />}
        {phase === 'quiz'    && <QuizScreen step={step} answers={answers} onToggle={toggle} onNext={next} onBack={() => setStep(s => s - 1)} />}
        {phase === 'loading' && <LoadingScreen answers={answers} />}
        {phase === 'results' && <ResultsScreen results={results} onReset={reset} />}
        {phase === 'error'   && <ErrorScreen message={errorMsg} onRetry={() => setPhase('quiz')} />}
      </div>
    </div>
  );

  // Mobil: fyld hele skærmen uden browser-ramme
  if (isMobile) {
    return (
      <div style={{ width: '100%', height: '100dvh', background: C.bg, overflow: 'hidden' }}>
        {innerContent}
      </div>
    );
  }
  // Stor skærm: behold den flotte browser-ramme
  return (
    <ChromeWindow
      tabs={[{ title: 'Bravo Tours – Find din rejse' }]}
      url="www.bravotours.dk/rejsegenerator"
      width={520}
      height={720}
    >
      {innerContent}
    </ChromeWindow>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<BravoApp/>);
